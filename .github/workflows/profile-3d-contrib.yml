name: Generate 3D contribution chart

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - conf/github-profile-3d-contrib.json
      - .github/workflows/profile-3d-contrib.yml

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json
      - name: Commit contribution chart updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/day.svg profile-3d-contrib/night.svg
          git diff --cached --quiet && exit 0
          git diff --cached --check
          git commit -m "chore(profile): refresh contribution charts" -m "- Regenerate light and dark charts from public GitHub activity."
          git push
